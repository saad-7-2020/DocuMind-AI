[project]
name = "documind"
version = "0.2.0"
description = "DocuMind AI: document question answering with grounded citations (RAG)."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    "python-multipart>=0.0.18",
    "pymupdf>=1.25",
    "charset-normalizer>=3.4",
    "httpx>=0.28",
    "numpy>=2.1",
    "structlog>=24.4",
]

[project.optional-dependencies]
# Real embedding models. Heavy (PyTorch), so tests don't need it.
ml = [
    "sentence-transformers>=3.3",
    "torch>=2.6",
]

[project.scripts]
documind = "documind.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/documind"]

# PyTorch with CUDA 12.6 wheels (supports the GTX 1660 Super, compute capability 7.5).
[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs the Postgres test database (docker compose up -d db)",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S608"]

[tool.ruff.lint.per-file-ignores]
"src/documind/generation/prompts.py" = ["E501"]  # prompt prose reads better unwrapped

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
