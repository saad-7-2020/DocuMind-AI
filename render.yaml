# OPTIONAL alternative to hosting the backend on Vercel (the recommended $0 path in docs/deployment.md).
# Render may ask for a payment card to verify an account, so use this only if you are comfortable with that.
#
# Render Blueprint: one FREE web service running the API + the ingestion worker thread.
# Render dashboard -> New -> Blueprint -> pick this repository. Values marked `sync: false` are
# secrets: Render asks you for them in the dashboard (they are never stored in git).
services:
  - type: web
    name: documind-api
    runtime: docker             # Render builds the image from backend/Dockerfile; you never run Docker yourself
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free                  # free: sleeps after 15 min without requests (about 1 min to wake up)
    region: frankfurt           # use the region closest to your Supabase project
    healthCheckPath: /health/live
    envVars:
      # --- Database (Supabase, free plan) ---
      - key: DATABASE_URL       # Supabase "Session pooler" string, with the postgresql+psycopg:// prefix
        sync: false
      # --- File storage (Supabase Storage, free plan, private bucket) ---
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY  # the `sb_secret_…` key from the Connect panel (Server tab)
        sync: false
      - key: SUPABASE_BUCKET
        value: documents
      - key: STORAGE_DIR        # upload spool only (the ephemeral disk is fine for that)
        value: /tmp/documind
      - key: MAX_UPLOAD_BYTES
        value: "20971520"       # 20 MB: keeps memory use predictable on a 512 MB instance
      # --- Embeddings: Cloudflare Workers AI, free daily allowance, same bge-m3 model as local ---
      - key: EMBEDDER
        value: openai_compat
      - key: EMBEDDING_BASE_URL # https://api.cloudflare.com/client/v4/accounts/<ACCOUNT_ID>/ai/v1
        sync: false
      - key: EMBEDDING_API_KEY  # a Cloudflare API token with the "Workers AI" permission
        sync: false
      - key: EMBEDDING_MODEL
        value: "@cf/baai/bge-m3"
      - key: EMBEDDING_DIM
        value: "1024"
      # --- LLM: Groq, free tier ---
      - key: GROQ_API_KEY
        sync: false
      # --- Runtime ---
      - key: RUN_WORKER_IN_API
        value: "true"
      - key: CORS_ORIGINS       # your Vercel URL, e.g. https://documind.vercel.app (set after the first Vercel deploy)
        sync: false
      - key: LOG_LEVEL
        value: INFO
